# Entorno LOCAL de desarrollo de taller004 (autocompletado en el IDE, probar scripts
# fuera de Docker). NO se despliega: cada contenedor se construye desde su propia
# carpeta (mlflow/, jupyter/, api/) con su propio pyproject.toml y uv.lock.
[project]
name = "taller004"
version = "0.1.0"
description = "Taller 4 - MLflow: experimentacion, registro de modelos e inferencia"
readme = "README.md"
authors = [
    { name = "Dierickb", email = "dierickbro@gmail.com" }
]
requires-python = "==3.11.*"
# Mismas versiones fijadas en jupyter/ y api/.
dependencies = [
    "mlflow==3.16.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "sqlalchemy==2.1.3",
    "psycopg2-binary==2.9.13",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]

[tool.uv]
# No es un paquete instalable: solo un entorno.
package = false
