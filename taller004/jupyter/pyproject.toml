[project]
name = "taller004-jupyter"
version = "0.1.0"
description = "JupyterLab (instalado con uv) para experimentar y registrar modelos en MLflow"
requires-python = "==3.11.*"
dependencies = [
    "jupyterlab==4.6.4",
    "mlflow==3.16.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "sqlalchemy==2.1.3",
    "psycopg2-binary==2.9.13",
    "pip",
]

[tool.uv]
package = false
