[project]
name = "ml_api"
version = "0.1.0"
description = "API de inferencia que consume los modelos entrenados en ml_jupyter"
readme = "README.md"
authors = [
    { name = "Dierickb", email = "dierickbro@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "scikit-learn>=1.6.1",
    "joblib>=1.5.0",
]

[project.scripts]
ml_api = "ml_api:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
