[project]
name = "ml-jupyter"
version = "0.1.0"
description = "Entorno JupyterLab (instalado con uv) para entrenar y versionar modelos"
readme = "README.md"
authors = [
    { name = "Dierickb", email = "dierickbro@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "jupyterlab>=4.2.0",
    "scikit-learn>=1.6.1",
    "joblib>=1.5.0",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "palmerpenguins",
]

[project.scripts]
ml-jupyter = "ml_jupyter:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
