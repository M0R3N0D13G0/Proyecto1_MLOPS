[project]
name = "proyecto1-inference-api"
version = "0.1.0"
description = "API de inferencia de proyecto1: sirve el modelo Covertype mas reciente desde MinIO"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "minio>=7.2",
    "scikit-learn==1.0.2",
    "numpy==1.21.6",
    "pandas==1.3.5",
    "scipy==1.7.3",
    "joblib==1.3.2"   
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
